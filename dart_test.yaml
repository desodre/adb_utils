# Configure test tags and default timeout.
#
# Run only integration tests (needs ADB server):
#   dart test --tags integration
#
# Run only device tests (needs connected device/emulator):
#   dart test --tags device
#
# Run all test suites via aggregate tag:
#   dart test --tags all_possible
#
# Run everything:
#   dart test
#
# Exclude device tests (CI without device):
#   dart test --exclude-tags device

tags:
  integration:
    description: "Requires ADB server running (adb start-server)"
  device:
    description: "Requires a physical or emulator device connected via ADB"
  real_device:
    description: "Requires a physical Android device (non-emulator)"
  multi_device:
    description: "Requires at least two devices connected simultaneously"
  destructive:
    description: "May restart ADB server or temporarily disrupt connected sessions"
  all_possible:
    description: "Aggregate tag to run all test suites in this repository"

timeout: 30s
